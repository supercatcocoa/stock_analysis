# 任意: PC を起動しっぱなしにしたくない場合、GitHub Actions で毎営業日に watch を実行する
# リポジトリの Settings > Secrets に EDINETDB_API_KEY / ANTHROPIC_API_KEY / DISCORD_WEBHOOK_URL を登録
# DB(data/stock_app.db) をリポジトリにコミットして状態を保持する（.gitignore の data/ 行を削除すること）
name: daily-watch

on:
  schedule:
    - cron: "0 7 * * 1-5" # 平日 16:00 JST（東証の大引け後）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m stock_app watch
        env:
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: commit db
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/stock_app.db
          git diff --cached --quiet || git commit -m "update watch signals" && git push
