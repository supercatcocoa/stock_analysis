# 任意: PC を起動しっぱなしにしたくない場合、GitHub Actions で毎営業日に watch を実行する
# リポジトリの Settings > Secrets に EDINETDB_API_KEY / ANTHROPIC_API_KEY / DISCORD_WEBHOOK_URL を登録
# DB(data/stock_app.db) をリポジトリにコミットして状態を保持する（.gitignore の data/ 行を削除すること）
name: daily-watch

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_app
    env:
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_app/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m stock_app db-info
      - run: python -m stock_app watch
